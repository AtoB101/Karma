# Karma — VPS 自动部署（push 到 main 触发：测试 → SSH 到服务器滚动更新）
# 所需 GitHub Secrets（repo 级）：
#   VPS_HOST      服务器 IP
#   VPS_SSH_USER  部署用户（如 deploy）
#   VPS_SSH_KEY   私钥（PEM，对应服务器 authorized_keys）
# 另需 repo Variable：
#   VPS_DEPLOY_ENABLED=true   不设时 deploy 这一步会跳过（单测照跑）
# 注意：deploy 跑的是 /opt/karma/repo 里那份检出的 deploy/vps/ci-deploy.sh，
# 它走 `karma deploy`（不重建镜像）。服务器上没有 /opt/karma/deploy.sh 这个文件。
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project (dev extras)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"
          python3 -m pip install -e packages/karma-openclaw
      - name: Unit tests (deploy gate)
        run: |
          set -euo pipefail
          python3 -m pytest tests/unit -q --tb=short
      - name: App import smoke check
        run: |
          set -euo pipefail
          python3 -c "import api.app; print('api.app import OK')"

  deploy:
    needs: test
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Rolling deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            bash /opt/karma/repo/deploy/vps/ci-deploy.sh
