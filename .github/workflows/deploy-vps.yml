# Karma — VPS 自动部署（push 到 main 触发：测试 → SSH 到服务器滚动更新）
#
# 需要的仓库配置（Settings → Secrets and variables → Actions）：
#   Secrets:   VPS_SSH_KEY      CI 用的私钥（**必须带 forced command**，见下）
#   Variables: VPS_HOST         服务器 IP
#              VPS_SSH_USER     部署用户
#              VPS_DEPLOY_ENABLED=true   不开这个变量 deploy 这一步会跳过
#
# 关于 VPS_SSH_KEY：服务器上 /root/.ssh/authorized_keys 里那条是**限制过的**——
#   command="...ci-deploy.sh..."，no-pty/no-port-forwarding/no-agent-forwarding/no-X11-forwarding
# 也就是说这把 key 拿不到 shell，只能触发部署脚本。生成与轮换见
# docs/DEPLOY_PIPELINE.md。
#
# 为什么要有 "Check deploy credentials" 这一步：以前 deploy job 挂在
# `vars.VPS_DEPLOY_ENABLED` 上，而仓库里既没有这个 variable、也没有 VPS_* 任何
# secret —— 于是这个 job **永远 skip，却显示绿色**。那是假绿灯：看板上一片绿，
# 实际每次发布都是人手工在服务器上跑。现在缺 secret 就明确报错并指出怎么补。
#
# 部署真正做的是什么：跑 /opt/karma/repo 里那份 deploy/vps/ci-deploy.sh，
# 它走 `karma deploy`（不重建镜像）并在最后自证「HEAD == origin/main」。
name: Deploy to VPS


on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project (dev extras)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"
          python3 -m pip install -e packages/karma-openclaw
      - name: Unit tests (deploy gate)
        run: |
          set -euo pipefail
          python3 -m pytest tests/unit -q --tb=short
      - name: App import smoke check
        run: |
          set -euo pipefail
          python3 -c "import api.app; print('api.app import OK')"

  deploy:
    needs: test
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deploy credentials are present
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VPS_SSH_KEY}" ] || missing="${missing} VPS_SSH_KEY(secret)"
          [ -n "${{ vars.VPS_HOST }}" ] || missing="${missing} VPS_HOST(variable)"
          [ -n "${{ vars.VPS_SSH_USER }}" ] || missing="${missing} VPS_SSH_USER(variable)"
          if [ -n "${missing}" ]; then
            echo "::error::deploy 配置不全，缺少:${missing}"
            echo "补法见 docs/DEPLOY_PIPELINE.md。"
            echo "宁可这里红一次，也不要一个永远 skip 的假绿灯。"
            exit 1
          fi
      - name: Rolling deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          # 服务器上那把 key 带 forced command，客户端发什么都会被忽略 ——
          # 真正执行的是 ci-deploy.sh。这里写出来只是让读日志的人知道发生了什么。
          script: |
            bash /opt/karma/repo/deploy/vps/ci-deploy.sh