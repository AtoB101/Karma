# Python API + Runtime — 全量测试（单元 + 集成 + 信任运行时）
#
# 与 Makefile 中 ``forge test`` 互补：本 Job 运行 ``scripts/run_public_acceptance_tests.sh``
#（``tests/`` + OpenManus/OpenClaw 包测试）。
name: Python tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev extras)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Public acceptance gate (tests + packages + karma-public mirror)
        run: |
          set -euo pipefail
          bash scripts/run_public_acceptance_tests.sh -q --tb=short

      # 同一批用例再跑一遍**逆序**：会话级内存库是全进程共享的，跨用例的顺序依赖
      # 只有换个顺序才会露头（正序绿、逆序红）。清表 fixture 负责堵，这一遍负责证明。
      - name: Public acceptance gate — reverse order (order-independence guard)
        run: |
          set -euo pipefail
          KARMA_TEST_ORDER=reverse bash scripts/run_public_acceptance_tests.sh -q --tb=short

      # 对抗/攻击套件也进 push 路径：WP-* 全项目对抗 + KSA/KSA2/TL/X402/AP2/runtime
      # 平台攻击回归 + 平台盘对抗 + 结构压测。以前它只写在 docs/STRESS_TEST_RUNBOOK.md
      # 里要人手动跑，没有任何 CI 或脚本调用它。
      # 跳过套件里的 E1（它会再跑一遍 full_chain_audit_gate.sh）—— 下一步就是它。
      - name: Adversarial whole-project suite (WP-* + platform security packs)
        run: |
          set -euo pipefail
          KARMA_WHOLE_PROJECT_SKIP_FULL_GATE=1 \
            python3 scripts/acceptance/adversarial_whole_project_suite.py

      - name: Full-chain audit gate (phase 1-3 + reverse-rule + prod prelaunch)
        run: |
          set -euo pipefail
          bash scripts/acceptance/full_chain_audit_gate.sh
