name: Security CI

on:
  pull_request:
    branches: ["**"]
  # 只挂 PR 的话，直推 main 的提交根本不进这条 workflow —— 实测 2026-09-16 之后
  # Slither 静态分析就再没在 main 上跑过，而期间合约改过三次（v4/v5 的取消闸状态机、
  # 买方放款确认、罚没方向防抢跑）。所以 push 到 main 也要跑。
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          forge install --no-commit
          python3 -m pip install --upgrade pip
          python3 -m pip install slither-analyzer

      - name: Forge tests
        run: forge test -vv --no-match-path "**/forge-std/**"

      - name: Gas snapshot (generate)
        run: forge snapshot --no-match-path "**/forge-std/**"

      - name: Slither gate
        run: ./scripts/slither-gate.sh --format text

      - name: Release readiness gate
        run: ./scripts/release-readiness.sh

      - name: Trust-engine public safety guard
        run: ./scripts/check-trust-engine-public-safety.sh

  # 运维脚本是「真出事时唯一能救命的东西」，但它们以前没有任何 CI 覆盖：
  # 备份、恢复演练、告警出口、部署入口、闸门本身，改坏了要等到线上那一刻才知道。
  # 这里只做能离线做的部分：解析 + 单测。
  ops-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for f in scripts/ops/*.sh deploy/vps/*.sh scripts/acceptance/verify-manifest.sh \
                   scripts/public-beta-security-gate.sh; do
            echo "bash -n ${f}"
            bash -n "${f}"
          done

      - name: Python ops scripts compile
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/*.py scripts/acceptance/verify_manifest.py
          echo "all ops scripts parse"

      - name: Ops unit tests
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pytest -q tests/unit/test_ops_s3_put.py tests/unit/test_ops_alert_poller.py \
                             tests/unit/test_deployment_manifest.py
