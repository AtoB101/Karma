# Deploy console static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public static site (console)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/apps
          cp -R apps/console _site/apps/console
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=apps/console/index.html">' \
            '<title>KARMA</title></head><body><p><a href="apps/console/index.html">Continue to KARMA Console</a></p></body></html>' \
            > _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
