name: Feature request
description: Suggest an improvement to the public protocol or API surface
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals within the **public** settlement / evidence scope (KarmaBilateral + P1–P8).
        See `docs/README.md` and the root `README.md` for the current developer map.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
