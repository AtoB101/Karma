# Karma - VPS Docker Compose (nginx反向代理, 无Caddy)
# 用法: docker compose --env-file /opt/karma/.env -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.paas
    image: karma-api:latest
    container_name: karma-api
    restart: unless-stopped
    env_file:
      - /opt/karma/.env
    # Source + durable state are bind-mounted; see the comments inline.
    volumes:
      # --- Application source ------------------------------------------------
      # The VPS has 1.6 GB of RAM and must never run `docker build` (an image
      # build here previously OOM-killed the box), so the image carries the
      # *dependencies* and the repo supplies the *code*. These are exactly the
      # top-level packages the app imports from /app, so
      #   git pull && docker compose up -d --no-build app
      # is the complete deploy. Read-only: the app never writes to its own tree.
      - ../agents:/app/agents:ro
      - ../api:/app/api:ro
      - ../config:/app/config:ro
      - ../core:/app/core:ro
      - ../db:/app/db:ro
      - ../decentralized_verifier:/app/decentralized_verifier:ro
      - ../evidence_runtime:/app/evidence_runtime:ro
      - ../sdk:/app/sdk:ro
      - ../services:/app/services:ro
      # --- Durable state -----------------------------------------------------
      # Platform Ed25519 signing key (settings.ed25519_*_key_path -> ./keys/*.pem).
      # Without this mount it lives in the container layer, so every recreate
      # silently rotated the platform key and invalidated earlier attestations
      # and public_key comparisons.
      - /opt/karma/keys:/app/keys
      # Identity / session JSON store: services/persist_json.py writes to
      # <repo>/mvp_data, i.e. /app/mvp_data inside the container. Every
      # `docker compose up` recreates the container, so without this bind mount
      # each recreate wipes every wallet-bound identity.
      - /opt/karma/mvp_data:/app/mvp_data
      # Agent bootstrap API keys, custody-held agent keys, agent boundaries /
      # profile cards, confirmation sessions and field captures all live in
      # <repo>/.karma_data. Same problem as mvp_data: without this mount a
      # recreate silently invalidates every minted agent API key.
      - /opt/karma/karma_data:/app/.karma_data
    environment:
      - PORT=8000
      - KARMA_ENV=production
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: karma-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-karma}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_DB=${POSTGRES_DB:-karma}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karma}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: karma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    logging: *logging

volumes:
  postgres_data:
  redis_data: