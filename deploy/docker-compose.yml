# Karma — VPS 部署（Docker Compose）
# 用法见 deploy/vps/README.md；机密一律放服务器上 /opt/karma/.env，绝不入库
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.paas
    image: karma-api:latest
    container_name: karma-api
    restart: unless-stopped
    env_file:
      - /opt/karma/.env
    environment:
      - PORT=8000
      - KARMA_ENV=production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 反向代理 + 自动 HTTPS（域名解析到本机后自动签发 Let's Encrypt 证书）
  caddy:
    image: caddy:2-alpine
    container_name: karma-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

  # PostgreSQL — 第3步数据层生产化时启用（依赖已在 pyproject 里）
  postgres:
    image: postgres:16-alpine
    container_name: karma-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-karma}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_DB=${POSTGRES_DB:-karma}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karma}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # Redis — 限流/缓存后端（可选，缺失时自动降级内存实现）
  redis:
    image: redis:7-alpine
    container_name: karma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
